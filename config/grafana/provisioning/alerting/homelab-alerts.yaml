apiVersion: 1

groups:
  - orgId: 1
    name: homelab-logs-1m
    folder: Homelab Alerts
    interval: 1m
    rules:
      # ------------------------------------------------------------------------
      # 1. Critical Systemd Journal Errors (emerg, alert, crit)
      # ------------------------------------------------------------------------
      - uid: homelab_systemd_crit_err
        title: Critical Systemd Journal Error
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "[{{ $labels.host }}] Critical {{ $labels.level }} in {{ $labels.unit }}: {{ $labels.sample_msg }}"
          description: "Host (VM/LXC): {{ $labels.host }}\nSystemd Unit: {{ $labels.unit }} (Process: {{ $labels.syslog_identifier }})\nSeverity: {{ $labels.level }}\nCount (last 5m): {{ $values.B.Value }}\nMessage: {{ $labels.sample_msg }}"
        labels:
          severity: critical
          source: systemd-journal
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (host, unit, level, syslog_identifier, sample_msg) (count_over_time({job="systemd-journal", level=~"emerg|alert|crit"} | pattern `<sample_msg>` [5m]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

      # ------------------------------------------------------------------------
      # 2. Docker Container Critical Errors (fatal, panic, OOM, segfault)
      # ------------------------------------------------------------------------
      - uid: homelab_docker_crit_err
        title: Docker Container Critical Error
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "[{{ $labels.host }}] Docker container '{{ $labels.container }}' error: {{ $labels.sample_msg }}"
          description: "Host (VM/LXC): {{ $labels.host }}\nContainer: {{ $labels.container }} (Compose: {{ $labels.compose_project }}/{{ $labels.compose_service }})\nOccurrences (last 5m): {{ $values.B.Value }}\nError Output: {{ $labels.sample_msg }}"
        labels:
          severity: critical
          source: docker
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (host, container, compose_project, compose_service, sample_msg) (count_over_time({job="docker", stream="stderr"} |~ "(?i)(fatal|panic|oom|segmentation fault|unhandled exception)" | pattern `<sample_msg>` [5m]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

      # ------------------------------------------------------------------------
      # 3. Host Log Stream Offline / No Logs Received
      # ------------------------------------------------------------------------
      - uid: homelab_host_log_offline
        title: Host Log Stream Offline
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "[{{ $labels.host }}] No logs received for >10m"
          description: "Loki has not received systemd-journal logs from host '{{ $labels.host }}' in the last 10 minutes. Check if the VM/LXC or Grafana Alloy service is stopped."
        labels:
          severity: warning
          source: loki-watchdog
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (host) (count_over_time({job="systemd-journal"}[10m]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

  - orgId: 1
    name: homelab-updates-daily
    folder: Homelab Alerts
    interval: 1h
    rules:
      # ------------------------------------------------------------------------
      # 4. Pending OS & Docker Container Updates (with package/container details)
      # ------------------------------------------------------------------------
      - uid: homelab_pending_updates
        title: Pending Homelab Server or Container Updates
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '[{{ $labels.host }}] {{ $values.B.Value }} {{ if eq $labels.update_type "docker" }}Docker container{{ else }}OS package{{ end }} update(s) available'
          description: "Host (VM/LXC): {{ $labels.host }}\nUpdate Type: {{ if eq $labels.update_type \"docker\" }}Docker Container Images{{ else }}OS Packages (apt/apk){{ end }}\nTotal Pending: {{ $values.B.Value }}\nSample Packages / Containers: {{ $labels.items }}"
        labels:
          severity: info
          source: homelab-updates
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              expr: 'max by (host, update_type, items) (max_over_time({job="systemd-journal", syslog_identifier="homelab-updates"} |= "UPDATES_AVAILABLE" | pattern `UPDATES_AVAILABLE: host=<_> type=<update_type> count=<pkg_count> <_>="<items>"` | unwrap pkg_count [24h]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

policies:
  - orgId: 1
    receiver: Discord Homelab
    group_by:
      - grafana_folder
      - alertname
      - host
