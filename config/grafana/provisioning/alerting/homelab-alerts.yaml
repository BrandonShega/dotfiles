apiVersion: 1

groups:
  - orgId: 1
    name: homelab-logs-1m
    folder: Homelab Alerts
    interval: 1m
    rules:
      # ------------------------------------------------------------------------
      # 1. Critical Systemd Journal Errors (emerg, alert, crit)
      # ------------------------------------------------------------------------
      - uid: homelab_systemd_crit_err
        title: Critical Systemd Journal Error
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Critical journal error on {{ $labels.host }} ({{ $labels.unit }})"
          description: "Host {{ $labels.host }} logged {{ $values.B }} critical event(s) in unit {{ $labels.unit }} over the last 5m."
        labels:
          severity: critical
          source: systemd-journal
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (host, unit) (count_over_time({job="systemd-journal", level=~"emerg|alert|crit"}[5m]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

      # ------------------------------------------------------------------------
      # 2. Docker Container Critical Errors (fatal, panic, OOM, segfault)
      # ------------------------------------------------------------------------
      - uid: homelab_docker_crit_err
        title: Docker Container Critical Error
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Container {{ $labels.container }} critical error on {{ $labels.host }}"
          description: "Container {{ $labels.container }} on {{ $labels.host }} emitted {{ $values.B }} fatal/panic stderr line(s) in the last 5m."
        labels:
          severity: critical
          source: docker
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (host, container) (count_over_time({job="docker", stream="stderr"} |~ "(?i)(fatal|panic|oom|segmentation fault|unhandled exception)" [5m]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

      # ------------------------------------------------------------------------
      # 3. Host Log Stream Offline / No Logs Received
      # ------------------------------------------------------------------------
      - uid: homelab_host_log_offline
        title: Host Log Stream Offline
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "No logs received from {{ $labels.host }} for >10m"
          description: "Loki has not received systemd-journal logs from {{ $labels.host }} in the last 10 minutes."
        labels:
          severity: warning
          source: loki-watchdog
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (host) (count_over_time({job="systemd-journal"}[10m]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

  - orgId: 1
    name: homelab-updates-daily
    folder: Homelab Alerts
    interval: 1h
    rules:
      # ------------------------------------------------------------------------
      # 4. Pending OS & Docker Container Updates
      # ------------------------------------------------------------------------
      - uid: homelab_pending_updates
        title: Pending Homelab Server or Container Updates
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Updates available on {{ $labels.host }}"
          description: "{{ $labels.host }} reported pending OS package or Docker container updates in the last 24h."
        labels:
          severity: info
          source: homelab-updates
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (host) (count_over_time({job="systemd-journal", syslog_identifier="homelab-updates"} |= "UPDATES_AVAILABLE" [24h]))'
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

policies:
  - orgId: 1
    receiver: Discord Homelab
    group_by:
      - grafana_folder
      - alertname
      - host

